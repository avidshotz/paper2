        // Load template based on selection
        function loadTemplate() {
            const selectedTemplate = document.getElementById('testTemplate').value;
            const htmlContent = document.getElementById('htmlContent');
            
            if (selectedTemplate === 'custom') {
                htmlContent.value = '';
                htmlContent.placeholder = 'Enter your custom HTML content here...';
            } else if (templates[selectedTemplate]) {
                htmlContent.value = templates[selectedTemplate];
            }
            
            showPreview();
        }

        // Show HTML preview
        function showPreview() {
            const htmlContent = document.getElementById('htmlContent').value;
            const previewSection = document.getElementById('previewSection');
            
            if (htmlContent.trim()) {
                previewSection.innerHTML = `
                    <h4>📋 HTML Preview (first 500 characters):</h4>
                    <pre>${htmlContent.substring(0, 500)}${htmlContent.length > 500 ? '...' : ''}</pre>
                `;
                previewSection.style.display = 'block';
            } else {
                previewSection.style.display = 'none';
            }
        }

        // Test PDF generation
        async function testPDFGeneration() {
            const statusEl = document.getElementById('status');
            const testBtn = document.getElementById('testBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Get form data
            const pdfServiceUrl = document.getElementById('pdfServiceUrl').value.trim();
            const htmlContent = document.getElementById('htmlContent').value.trim();

            // Validation
            if (!pdfServiceUrl || !htmlContent) {
                showStatus('Please provide PDF service URL and HTML content', 'error');
                return;
            }

            // Show loading state
            testBtn.disabled = true;
            testBtn.textContent = '🔄 Generating PDF...';
            downloadBtn.disabled = true;
            showStatus('Calling Vercel PDF service...', 'loading');

            try {
                console.log('🚀 Sending request to:', pdfServiceUrl);
                console.log('📄 HTML content length:', htmlContent.length);

                const response = await fetch(pdfServiceUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ html: htmlContent })
                });

                console.log('📡 Response status:', response.status, response.statusText);

                if (!response.ok) {
                    throw new Error(`PDF generation failed: ${response.status} ${response.statusText}`);
                }

                // Get the PDF blob
                lastPDFBlob = await response.blob();
                console.log('✅ PDF generated successfully, size:', lastPDFBlob.size, 'bytes');

                showStatus(`🎉 Success! PDF generated (${(lastPDFBlob.size / 1024).toFixed(1)} KB)`, 'success');
                downloadBtn.disabled = false;

            } catch (error) {
                console.error('❌ Test error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
                lastPDFBlob = null;
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🚀 Generate PDF';
            }
        }

        // Download last generated PDF
        function downloadLastPDF() {
            if (!lastPDFBlob) {
                alert('No PDF to download. Generate one first.');
                return;
            }

            try {
                const url = URL.createObjectURL(lastPDFBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `test-document-${new Date().toISOString().split('T')[0]}.pdf`;
                a.click();
                URL.revokeObjectURL(url);
                
                showStatus('📥 PDF downloaded successfully!', 'success');
                console.log('📥 PDF download initiated');
            } catch (error) {
                console.error('Download error:', error);
                showStatus(`❌ Download failed: ${error.message}`, 'error');
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        // Initialize with default template
        window.onload = function() {
            loadTemplate();
        };

        // Update preview when typing
        document.getElementById('htmlContent').addEventListener('input', showPreview);
    </script>
