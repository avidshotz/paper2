<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Resume Content</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #005c99; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🎯 Test Resume Content</h1>
    <p>Now let's test the actual resume content to find what breaks</p>
    
    <button onclick="testBasicResume()">Test: Basic Resume Structure</button>
    <button onclick="testWithCSS()">Test: Resume + CSS</button>
    <button onclick="testWithColors()">Test: Resume + Colors</button>
    <button onclick="testWithBorders()">Test: Resume + Borders</button>
    <button onclick="testFullResume()">Test: Full Resume Template</button>
    
    <div id="status"></div>

    <script>
        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';

        function showStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testPDF(name, html) {
            showStatus(`🔄 Testing: ${name}...`, 'info');
            console.log(`Testing: ${name}`);
            
            try {
                const response = await fetch(PDF_SERVICE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: html })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const sizeKB = (blob.size / 1024).toFixed(1);
                    showStatus(`✅ ${name}: SUCCESS! PDF generated (${sizeKB} KB)`, 'success');
                    
                    // Auto-download the PDF
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `resume-test-${name.toLowerCase().replace(/[^a-z0-9]/g, '-')}.pdf`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    return true;
                } else {
                    const errorText = await response.text();
                    showStatus(`❌ ${name}: FAILED! HTTP ${response.status} - ${errorText.substring(0, 100)}`, 'error');
                    return false;
                }
            } catch (error) {
                showStatus(`❌ ${name}: ERROR! ${error.message}`, 'error');
                return false;
            }
        }

        async function testBasicResume() {
            const html = `<html>
<head>
    <meta charset="UTF-8">
    <title>Resume</title>
</head>
<body>
    <h1>John Smith</h1>
    <p>Senior Software Engineer</p>
    
    <h2>Experience</h2>
    <h3>Software Engineer | Company | 2020 - Present</h3>
    <ul>
        <li>Developed web applications</li>
        <li>Built REST APIs</li>
    </ul>
    
    <h2>Skills</h2>
    <ul>
        <li>JavaScript, React, Node.js</li>
        <li>Python, PostgreSQL</li>
    </ul>
</body>
</html>`;
            await testPDF('Basic Resume Structure', html);
        }

</body>
</html>`;
            await testPDF('Resume + CSS', html);

            await testPDF('Full Resume Template', html);

    </script>
</body>
