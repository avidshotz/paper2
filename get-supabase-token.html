<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Supabase Auth Token</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2563eb;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .token-display {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #d1d5db;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Get Supabase Auth Token</h1>
        <p>Use this tool to get a valid JWT token for testing your Supabase function.</p>
        
        <div class="form-group">
            <label for="supabaseUrl">Supabase URL:</label>
            <input type="text" id="supabaseUrl" value="https://sdlmyaffbnjkmzwpdwqp.supabase.co" placeholder="https://your-project.supabase.co">
        </div>
        
        <div class="form-group">
            <label for="supabaseKey">Supabase Anon Key:</label>
            <input type="password" id="supabaseKey" placeholder="Your Supabase anon key">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="test@example.com">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="password">
        </div>
        
        <button onclick="signUp()">Create Account & Get Token</button>
        <button onclick="signIn()">Sign In & Get Token</button>
        
        <div id="status"></div>
        <div id="tokenDisplay" style="display: none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabase = null;

        function initSupabase() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            
            if (!url || !key) {
                showStatus('Please enter Supabase URL and Anon Key', 'error');
                return false;
            }
            
            supabase = window.supabase.createClient(url, key);
            return true;
        }

        async function signUp() {
            if (!initSupabase()) return;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showStatus('Please enter email and password', 'error');
                return;
            }
            
            try {
                showStatus('Creating account...', 'info');
                
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });
                
                if (error) throw error;
                
                if (data.session) {
                    showToken(data.session.access_token);
                    showStatus('Account created and signed in successfully!', 'success');
                } else {
                    showStatus('Account created! Check your email to verify, then try signing in.', 'success');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function signIn() {
            if (!initSupabase()) return;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showStatus('Please enter email and password', 'error');
                return;
            }
            
            try {
                showStatus('Signing in...', 'info');
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });
                
                if (error) throw error;
                
                showToken(data.session.access_token);
                showStatus('Signed in successfully!', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function showToken(token) {
            const tokenDisplay = document.getElementById('tokenDisplay');
            tokenDisplay.innerHTML = `
                <h3>🎉 Your JWT Token:</h3>
                <div class="token-display">${token}</div>
                <p><strong>Use this in your test:</strong> Add "Bearer ${token}" to the Authorization header</p>
                <button onclick="copyToken('${token}')">Copy Token</button>
            `;
            tokenDisplay.style.display = 'block';
        }

        function copyToken(token) {
            navigator.clipboard.writeText(`Bearer ${token}`).then(() => {
                showStatus('Token copied to clipboard!', 'success');
            });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
    </script>
</body>
</html>
