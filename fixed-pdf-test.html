    <button onclick="generatePDF()">🚀 Generate PDF</button>
    <button onclick="downloadPDF()" id="downloadBtn" disabled>📥 Download PDF</button>
    
    <div id="status"></div>

    <script>
        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';
        let pdfBlob = null;

        async function generatePDF() {
            const htmlContent = document.getElementById('htmlContent').value;
            const statusEl = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Check if DOCTYPE is present and warn user
            if (htmlContent.includes('<!DOCTYPE')) {
                statusEl.innerHTML = '<div class="status error">❌ Remove DOCTYPE declaration! Your PDF service can\'t handle it.</div>';
                return;
            }
            
            statusEl.innerHTML = '<div class="status info">🔄 Generating PDF...</div>';
            downloadBtn.disabled = true;
            
            try {
                const response = await fetch(PDF_SERVICE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: htmlContent })
                });

                if (response.ok) {
                    pdfBlob = await response.blob();
                    const sizeKB = (pdfBlob.size / 1024).toFixed(1);
                    statusEl.innerHTML = `<div class="status success">✅ PDF generated! Size: ${sizeKB} KB</div>`;
                    downloadBtn.disabled = false;
                } else {
                    throw new Error(`Failed: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
                pdfBlob = null;
            }
        }

        function downloadPDF() {
            if (!pdfBlob) return;
            
            const url = URL.createObjectURL(pdfBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'resume.pdf';
            a.click();
            URL.revokeObjectURL(url);
            
            document.getElementById('status').innerHTML = '<div class="status success">📥 PDF downloaded!</div>';
        }
    </script>
