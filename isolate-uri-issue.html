<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Isolate URI Issue</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #005c99; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔍 Isolate URI Issue</h1>
    <p>The error is "URI malformed" - let's find what's causing it</p>
    
    <button onclick="testEmailContent()">Test: Email Content</button>
    <button onclick="testLinkedInContent()">Test: LinkedIn Content</button>
    <button onclick="testBothURLs()">Test: Both URLs</button>
    <button onclick="testWithoutURLs()">Test: Resume Without URLs</button>
    <button onclick="testEscapedURLs()">Test: Escaped URLs</button>
    
    <div id="status"></div>

    <script>
        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';

        function showStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testPDF(name, html) {
            showStatus(`🔄 Testing: ${name}...`, 'info');
            console.log(`Testing: ${name}`);
            
            try {
                const response = await fetch(PDF_SERVICE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: html })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const sizeKB = (blob.size / 1024).toFixed(1);
                    showStatus(`✅ ${name}: SUCCESS! PDF generated (${sizeKB} KB)`, 'success');
                    return true;
                } else {
                    const errorText = await response.text();
                    showStatus(`❌ ${name}: FAILED! HTTP ${response.status} - ${errorText.substring(0, 150)}`, 'error');
                    return false;
                }
            } catch (error) {
                showStatus(`❌ ${name}: ERROR! ${error.message}`, 'error');
                return false;
            }
        }

        // Test just email content
        async function testEmailContent() {
            const html = `<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
    <h1>John Smith</h1>
    <p><strong>Email:</strong> john.smith@email.com</p>
</body>
</html>`;
            await testPDF('Email Content', html);
        }

        // Test just LinkedIn content  
        async function testLinkedInContent() {
            const html = `<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
    <h1>John Smith</h1>
    <p><strong>LinkedIn:</strong> linkedin.com/in/johnsmith</p>
</body>
</html>`;
            await testPDF('LinkedIn Content', html);
        }

        // Test both URLs together
        async function testBothURLs() {
            const html = `<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
    <h1>John Smith</h1>
    <p><strong>Email:</strong> john.smith@email.com | <strong>LinkedIn:</strong> linkedin.com/in/johnsmith</p>
</body>
</html>`;
            await testPDF('Both URLs', html);
        }

        // Test resume without any URLs
        async function testWithoutURLs() {
            const html = `<html>
<head>
    <meta charset="UTF-8">
    <title>Professional Resume</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .contact-info { background: #f8f9fa; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>John Smith</h1>
    
    <div class="contact-info">
        <p><strong>Phone:</strong> (555) 123-4567</p>
        <p><strong>Location:</strong> San Francisco, CA</p>
    </div>

    <h2>Experience</h2>
    <h3>Software Engineer | InnovaTech Solutions | 2020 - Present</h3>
    <ul>
        <li>Developed responsive web applications serving 100K+ users</li>
        <li>Built REST APIs using Node.js and Express framework</li>
    </ul>

    <h2>Skills</h2>
    <ul>
        <li><strong>Frontend:</strong> React, JavaScript, HTML5, CSS3</li>
        <li><strong>Backend:</strong> Node.js, Express, Python</li>
    </ul>
</body>
</html>`;
            await testPDF('Resume Without URLs', html);
        }

        // Test with escaped/encoded URLs
        async function testEscapedURLs() {
            const html = `<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
    <h1>John Smith</h1>
    <p><strong>Email:</strong> john.smith[at]email.com</p>
    <p><strong>LinkedIn:</strong> linkedin dot com/in/johnsmith</p>
</body>
</html>`;
            await testPDF('Escaped URLs', html);
        }
    </script>
</body>
</html>
