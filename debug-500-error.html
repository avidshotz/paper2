<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Debug 500 Error</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #005c99; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .test-result { font-family: monospace; background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Debug 500 Error</h1>
    <p>Let's test different HTML to find what's causing the 500 error</p>
    
    <button onclick="test1()">Test 1: Super Minimal</button>
    <button onclick="test2()">Test 2: Basic HTML</button>
    <button onclick="test3()">Test 3: With CSS</button>
    <button onclick="test4()">Test 4: Complex CSS</button>
    <button onclick="test5()">Test 5: Full Resume</button>
    
    <div id="results"></div>

    <script>
        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';
        let testResults = [];

        function addResult(testName, success, details) {
            testResults.push({ testName, success, details, time: new Date().toLocaleTimeString() });
            updateResults();
        }

        function updateResults() {
            const resultsEl = document.getElementById('results');
            let html = '<h3>Test Results:</h3>';
            testResults.forEach(result => {
                const icon = result.success ? '✅' : '❌';
                html += `<div class="test-result">[${result.time}] ${icon} ${result.testName}: ${result.details}</div>`;
            });
            resultsEl.innerHTML = html;
        }

        async function testHTML(testName, htmlContent) {
            try {
                console.log(`Testing: ${testName}`);
                console.log(`HTML: ${htmlContent}`);
                
                const response = await fetch(PDF_SERVICE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: htmlContent })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const sizeKB = (blob.size / 1024).toFixed(1);
                    addResult(testName, true, `SUCCESS - PDF: ${sizeKB}KB`);
                    return true;
                } else {
                    const errorText = await response.text();
                    addResult(testName, false, `HTTP ${response.status} - ${errorText.substring(0, 100)}`);
                    return false;
                }
            } catch (error) {
                addResult(testName, false, `ERROR: ${error.message}`);
                return false;
            }
        }

        async function test1() {
            const html = '<html><body><h1>Test</h1></body></html>';
            await testHTML('Super Minimal', html);
        }

        async function test2() {
            const html = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body><h1>Test</h1><p>Basic HTML</p></body>
</html>`;
            await testHTML('Basic HTML', html);
        }

        async function test3() {
            const html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: blue; }
    </style>
</head>
<body><h1>Test</h1><p>With CSS</p></body>
</html>`;
            await testHTML('With CSS', html);
        }

        async function test4() {
            const html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.3; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .box { background: #f8f9fa; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Complex CSS Test</h1>
    <div class="box">
        <p>Content with styling</p>
    </div>
</body>
</html>`;
            await testHTML('Complex CSS', html);
        }

        async function test5() {
            // This is the exact HTML from your simple-pdf-test.html
            const html = `<!DOCTYPE html>
<html>
<head>

        <p><strong>Location:</strong> San Francisco, CA | <strong>LinkedIn:</strong> linkedin.com/in/johnsmith</p>
    </div>

    <div class="content">
        <h2>Professional Summary</h2>

        <h2>Experience</h2>
        <div class="section">
            <h3>Software Engineer | InnovaTech Solutions | 2020 - Present</h3>
            <ul>
                <li>Developed responsive web applications serving 100K+ users</li>

        <h2>Skills</h2>
        <ul>
            <li><strong>Frontend:</strong> React, JavaScript, HTML5, CSS3</li>
            <li><strong>Backend:</strong> Node.js, Express, Python</li>
        </ul>

        <h2>Education</h2>
        <p><strong>Bachelor of Science in Computer Science</strong><br>
        University of California, Berkeley | 2018</p>
    </div>
</body>
</html>`;
            await testHTML('Full Resume', html);
        }
    </script>
</body>
</html>
