<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Generation Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
        }
        .btn-success {
            background: #059669;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #047857;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.loading {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .config-section {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }
        .config-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 15px;
        }
        .sample-data {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 4px solid #2563eb;
        }
        .sample-data h4 {
            margin: 0 0 10px 0;
            color: #374151;
        }
        .response-preview {
            background: #1f2937;
            color: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 PDF Generation Test</h1>
        <p style="text-align: center; color: #6b7280; margin-bottom: 30px;">
            Test your Supabase Edge Function + Vercel PDF Service integration
        </p>

        <!-- Configuration Section -->
        <div class="config-section">
            <div class="config-title">⚙️ Configuration</div>
            
            <div class="form-group">
                <label for="supabaseUrl">Supabase URL:</label>
                <input type="text" id="supabaseUrl" value="https://sdlmyaffbnjkmzwpdwqp.supabase.co" placeholder="https://your-project.supabase.co">
            </div>
            
            <div class="form-group">
                <label for="authToken">Auth Token (optional):</label>
                <input type="password" id="authToken" placeholder="Bearer token for authenticated requests">
            </div>
        </div>

        <!-- Test Data Section -->
        <div class="form-group">
            <label for="testMode">Test Mode:</label>
            <select id="testMode" onchange="loadTestData()">
                <option value="sample">Use Sample Data</option>
                <option value="custom">Custom Input</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jobDescription">Job Description:</label>
            <textarea id="jobDescription" placeholder="Enter job description..."></textarea>
        </div>

        <div class="form-group">
            <label for="currentResume">Current Resume Content:</label>
            <textarea id="currentResume" placeholder="Enter current resume content..."></textarea>
        </div>

        <div class="form-group">
            <label for="fullExperience">Full Experience Details:</label>
            <textarea id="fullExperience" placeholder="Enter full experience details..."></textarea>
        </div>

        <div class="form-group">
            <label for="resumeName">Resume Name:</label>
            <input type="text" id="resumeName" value="Professional Resume" placeholder="Resume name">
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn-secondary" onclick="loadSampleData()">📝 Load Sample Data</button>
            <button class="btn-primary" onclick="testPDFGeneration()" id="testBtn">🚀 Test PDF Generation</button>
            <button class="btn-success" onclick="downloadLastPDF()" id="downloadBtn" disabled>📥 Download Last PDF</button>
        </div>

        <!-- Status Display -->
        <div id="status" style="display: none;"></div>

        <!-- Response Preview -->
        <div id="responsePreview" style="display: none;"></div>
    </div>

    <script>
        let lastResponse = null;

        // PDF Service Configuration
        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';

        // PDF generation function using Vercel service
        async function generatePDFFromHTML(htmlContent) {
            const response = await fetch(PDF_SERVICE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: htmlContent })
            });

            if (!response.ok) {
                throw new Error(`PDF generation failed: ${response.status} ${response.statusText}`);
            }

            const pdfBlob = await response.blob();
            
            // Convert to base64 for storage
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function() {
                    const base64 = reader.result.split(',')[1]; // Remove data:application/pdf;base64, prefix
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(pdfBlob);
            });
        }

        // Load sample data
        function loadSampleData() {
            document.getElementById('jobDescription').value = `We are seeking a Senior Software Engineer to join our dynamic team at TechCorp Inc. The ideal candidate will have 5+ years of experience in full-stack development, with expertise in React, Node.js, and cloud technologies.

Responsibilities:
• Develop and maintain scalable web applications
• Collaborate with cross-functional teams to define and implement new features
• Write clean, maintainable, and well-documented code
• Participate in code reviews and mentor junior developers
• Work with AWS cloud services and microservices architecture
• Implement automated testing and CI/CD pipelines

Requirements:
• Bachelor's degree in Computer Science or related field
• 5+ years of professional software development experience
• Strong proficiency in JavaScript, React, and Node.js
• Experience with AWS cloud services (EC2, S3, Lambda, RDS)
• Knowledge of RESTful APIs and GraphQL
• Familiarity with Docker and container orchestration
• Experience with agile development methodologies
• Excellent problem-solving and communication skills`;

            document.getElementById('currentResume').value = `John Smith
Senior Software Engineer
Email: john.smith@email.com | Phone: (555) 123-4567
Location: San Francisco, CA | LinkedIn: linkedin.com/in/johnsmith

PROFESSIONAL SUMMARY
Experienced software engineer with 6+ years developing scalable web applications. Proven track record in full-stack development using modern technologies including React, Node.js, and cloud platforms.

EXPERIENCE
Software Engineer | InnovaTech Solutions | 2020 - Present
• Developed responsive web applications serving 100K+ users
• Built REST APIs using Node.js and Express framework
• Implemented automated testing reducing deployment time by 40%
• Collaborated with product teams to deliver features on schedule

Junior Developer | StartupXYZ | 2018 - 2020
• Created frontend components using React and Redux
• Participated in agile development process
• Assisted in database design and optimization

SKILLS
• Frontend: React, JavaScript, HTML5, CSS3, Redux
• Backend: Node.js, Express, Python, REST APIs
• Databases: PostgreSQL, MongoDB
• Cloud: AWS (EC2, S3), Docker
• Tools: Git, Jest, Webpack

EDUCATION
Bachelor of Science in Computer Science
University of California, Berkeley | 2018`;

            document.getElementById('fullExperience').value = `COMPLETE PROFESSIONAL EXPERIENCE:

CURRENT ROLE:
Software Engineer at InnovaTech Solutions (2020 - Present)
• Lead developer on customer portal project serving 100,000+ active users
• Architected and implemented microservices using Node.js and Express
• Built responsive React applications with Redux state management
• Designed and optimized PostgreSQL database schemas
• Implemented comprehensive test suites using Jest and Cypress (95% code coverage)
• Reduced deployment time from 2 hours to 30 minutes through CI/CD automation
• Mentored 2 junior developers and led code review sessions

TECHNICAL SKILLS:
Programming Languages: JavaScript (ES6+), Python, TypeScript, Java, SQL
Frontend Technologies: React, Redux, Vue.js, HTML5, CSS3, SASS, Material-UI
Backend Technologies: Node.js, Express, Python Flask, Django
Databases: PostgreSQL, MongoDB, MySQL, Redis
Cloud & DevOps: AWS (EC2, S3, Lambda, RDS, CloudFront), Docker, Kubernetes
Tools & Methodologies: Git, GitHub Actions, Jenkins, Jest, Cypress, Agile/Scrum

CERTIFICATIONS:
• AWS Certified Developer Associate (2021)
• Google Analytics Certified (2020)

EDUCATION:
Bachelor of Science in Computer Science
University of California, Berkeley (2014-2018)
GPA: 3.7/4.0`;
        }

        // Load test data based on mode
        function loadTestData() {
            const mode = document.getElementById('testMode').value;
            if (mode === 'sample') {
                loadSampleData();
            } else {
                // Clear for custom input
                document.getElementById('jobDescription').value = '';
                document.getElementById('currentResume').value = '';
                document.getElementById('fullExperience').value = '';
            }
        }

        // Test PDF generation
        async function testPDFGeneration() {
            const statusEl = document.getElementById('status');
            const testBtn = document.getElementById('testBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const responsePreview = document.getElementById('responsePreview');
            
            // Get form data
            const supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            const authToken = document.getElementById('authToken').value.trim();
            const jobDescription = document.getElementById('jobDescription').value.trim();
            const currentResume = document.getElementById('currentResume').value.trim();
            const fullExperience = document.getElementById('fullExperience').value.trim();
            const resumeName = document.getElementById('resumeName').value.trim();

            // Validation
            if (!supabaseUrl || !jobDescription || !currentResume) {
                showStatus('Please fill in required fields (Supabase URL, Job Description, Current Resume)', 'error');
                return;
            }

            // Prepare request
            const payload = {
                jobDescription,
                resumeId: 'test-resume-1',
                userId: 'test-user',
                currentResume,
                fullExperience,
                resumeName
            };

            const headers = {
                'Content-Type': 'application/json'
            };

            if (authToken) {
                headers['Authorization'] = authToken.startsWith('Bearer ') ? authToken : `Bearer ${authToken}`;
            }

            // Show loading state
            testBtn.disabled = true;
            testBtn.textContent = '🔄 Testing...';
            downloadBtn.disabled = true;
            showStatus('Calling Supabase Edge Function...', 'loading');

            try {
                console.log('Sending request to:', `${supabaseUrl}/functions/v1/tailor-resume`);
                console.log('Payload:', payload);

                const response = await fetch(`${supabaseUrl}/functions/v1/tailor-resume`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                lastResponse = data;

                console.log('Response:', data);

                // Show response preview
                responsePreview.innerHTML = `
                    <h4>📡 API Response:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                responsePreview.style.display = 'block';

                if (response.ok && data.success) {
                    // Check if we got HTML content that needs to be converted to PDF
                    if (data.resumeHTML && data.coverLetterHTML) {
                        showStatus('✅ Received HTML content, converting to PDF...', 'loading');
                        
                        try {
                            // Generate PDFs from HTML using Vercel service
                            const [resumePDF, coverLetterPDF] = await Promise.all([
                                generatePDFFromHTML(data.resumeHTML),
                                generatePDFFromHTML(data.coverLetterHTML)
                            ]);
                            
                            // Update response with PDF data
                            data.resumePDF = resumePDF;
                            data.coverLetterPDF = coverLetterPDF;
                            lastResponse = data;
                            
                            showStatus(`🎉 Success! Generated PDF files. Resume: ${data.resumeFileName}, Cover Letter: ${data.coverLetterFileName}`, 'success');
                            downloadBtn.disabled = false;
                            
                        } catch (pdfError) {
                            console.error('PDF generation failed:', pdfError);
                            showStatus(`⚠️ PDF generation failed: ${pdfError.message}. HTML received but PDF conversion failed.`, 'error');
                            
                            // Fallback: keep HTML in response
                            data.resumePDF = data.resumeHTML;
                            data.coverLetterPDF = data.coverLetterHTML;
                            lastResponse = data;
                            downloadBtn.disabled = false;
                        }
                    } else if (data.resumePDF && data.coverLetterPDF) {
                        // Legacy: direct PDF data
                        showStatus(`✅ Success! Received PDF data directly. Resume: ${data.resumeFileName}, Cover Letter: ${data.coverLetterFileName}`, 'success');
                        downloadBtn.disabled = false;
                    } else {
                        showStatus('⚠️ Success but no PDF or HTML content received', 'error');
                    }
                } else {
                    const errorMsg = data.error || data.message || `HTTP ${response.status}`;
                    showStatus(`❌ Error: ${errorMsg}`, 'error');
                }
            } catch (error) {
                console.error('Test error:', error);
                showStatus(`❌ Network Error: ${error.message}`, 'error');
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🚀 Test PDF Generation';
            }
        }

        // Download last generated PDF
        function downloadLastPDF() {
            if (!lastResponse || !lastResponse.success) {
                alert('No successful PDF generation to download');
                return;
            }

            // Download resume
            if (lastResponse.resumePDF) {
                downloadPDFBlob(lastResponse.resumePDF, lastResponse.resumeFileName || 'resume.pdf');
            }

            // Download cover letter
            if (lastResponse.coverLetterPDF) {
                setTimeout(() => {
                    downloadPDFBlob(lastResponse.coverLetterPDF, lastResponse.coverLetterFileName || 'cover-letter.pdf');
                }, 500);
            }
        }

        // Helper function to download PDF blob
        function downloadPDFBlob(pdfData, fileName) {
            try {
                let blob;
                
                if (pdfData.startsWith('<!DOCTYPE html') || pdfData.startsWith('<html')) {
                    // HTML fallback
                    blob = new Blob([pdfData], { type: 'text/html; charset=utf-8' });
                    fileName = fileName.replace('.pdf', '.html');
                } else {
                    // Base64 PDF data
                    const byteCharacters = atob(pdfData);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    blob = new Blob([byteArray], { type: 'application/pdf' });
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
                URL.revokeObjectURL(url);
                
                console.log('Downloaded:', fileName);
            } catch (error) {
                console.error('Download error:', error);
                alert('Error downloading file: ' + error.message);
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        // Initialize with sample data
        window.onload = function() {
            loadSampleData();
        };
    </script>
</body>
</html>
