<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezlie</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      width: 320px;
      background: #f9f9f9;
      color: #222;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .logo img {
      width: 24px;
      margin-right: 8px;
    }

    h2 {
      font-size: 1.2rem;
      margin: 0;
    }

    label {
      font-size: 0.9rem;
      margin-top: 12px;
      display: block;
    }

    select, textarea {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    /* Unified Button System */
    .btn {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      font-size: 1rem;
      background: #4f46e5;
      color: white;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .btn:hover {
      background: #4338ca;
      border-color: #4338ca;
    }

    .btn:disabled {
      background: #6b7280;
      border-color: #6b7280;
      cursor: not-allowed;
    }

    /* Legacy support - all buttons use .btn class */
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      font-size: 1rem;
      background: #4f46e5;
      color: white;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    button:hover {
      background: #4338ca;
      border-color: #4338ca;
    }

    button:disabled {
      background: #6b7280;
      border-color: #6b7280;
      cursor: not-allowed;
    }

    pre {
      margin-top: 12px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 0;
      flex-shrink: 1;
      min-width: 0;
    }

    .user-info-btn {
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.2);
      border-radius: 6px;
      padding: 8px 10px;
      color: #4f46e5;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      transition: all 0.2s ease;
      min-width: 140px;
      max-width: 160px;
      flex-shrink: 0;
    }

    .user-info-btn:hover {
      background: rgba(79, 70, 229, 0.2);
      transform: translateY(-1px);
    }

    .user-info-btn .user-email {
      font-weight: 600;
      font-size: 11px;
      opacity: 0.9;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      word-break: break-all;
    }

    .user-info-btn .user-credits {
      font-size: 10px;
      opacity: 0.8;
      text-align: right;
    }

    .user-info-btn .user-subscription {
      font-size: 10px;
      opacity: 0.7;
      font-style: italic;
      text-align: right;
    }

    .resume-manager {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
    }

    .resume-manager h3 {
      margin: 0 0 8px 0;
      color: #1e293b;
      font-size: 1rem;
    }

    .resume-manager label {
      font-weight: 600;
      color: #374151;
    }

    .resume-manager textarea {
      border: 1px solid #d1d5db;
      background: #fff;
    }

    .resume-manager textarea:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Safari compatibility */
    * {
      -webkit-user-select: none;
      user-select: none;
    }

    textarea, pre {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Button Color Variants */
    .btn-success {
      background: #10b981;
      border-color: #10b981;
      margin-right: 5px;
    }

    .btn-success:hover {
      background: #059669;
      border-color: #059669;
    }

    .btn-primary {
      background: #3b82f6;
      border-color: #3b82f6;
      margin-right: 5px;
    }

    .btn-primary:hover {
      background: #2563eb;
      border-color: #2563eb;
    }

    .btn-secondary {
      background: #6b7280;
      border-color: #6b7280;
      margin-right: 5px;
    }

    .btn-secondary:hover {
      background: #4b5563;
      border-color: #4b5563;
    }

    .btn-purple {
      background: #7c3aed;
      border-color: #7c3aed;
    }

    .btn-purple:hover {
      background: #6d28d9;
      border-color: #6d28d9;
    }

    .btn-green {
      background: #059669;
      border-color: #059669;
    }

    .btn-green:hover {
      background: #047857;
      border-color: #047857;
    }

    /* Resume manager styles */
    .resume-manager-header {
      margin-bottom: 10px;
    }

    .resume-manager-header h3 {
      margin: 0 0 10px 0;
      color: #1e293b;
    }

    .resume-manager-header p {
      margin: 0;
      color: #64748b;
    }

    .resume-manager-section {
      margin-bottom: 10px;
    }

    .resume-manager-section textarea {
      width: 100%;
      height: 120px;
      margin-top: 5px;
    }

    .resume-manager-section:nth-child(3) textarea {
      height: 150px;
    }

    .resume-manager-buttons {
      margin-bottom: 10px;
    }

    .resume-manager-buttons button {
      width: auto;
      margin-right: 5px;
    }

    .resume-manager-tip {
      margin-top: 10px;
      font-size: 0.8em;
      color: #666;
    }

    /* Preview styles */
    .preview-header {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .preview-header h3 {
      margin: 0 0 10px 0;
      color: #1e293b;
    }

    .preview-header p {
      margin: 0 0 8px 0;
      font-size: 0.9em;
      color: #64748b;
    }

    .preview-section {
      margin-bottom: 15px;
    }

    .preview-section h4 {
      margin: 0 0 8px 0;
      color: #374151;
    }

    .preview-content {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
    }

    .preview-actions {
      margin-top: 10px;
    }

    .preview-actions button {
      width: auto;
      margin-right: 5px;
    }

    /* Resume list styles */
    .resume-list-header {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .resume-list-header h3 {
      margin: 0 0 10px 0;
      color: #1e293b;
    }

    .resume-list-header p {
      margin: 0;
      font-size: 0.9em;
      color: #64748b;
    }

    .resume-item {
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .resume-item.has-content {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .resume-item.empty {
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .resume-item-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .resume-item-content h4 {
      margin: 0 0 4px 0;
      color: #1e293b;
    }

    .resume-item-content p {
      margin: 0;
      font-size: 0.8em;
      color: #64748b;
    }

    .resume-icon {
      font-size: 1.2em;
    }

    /* Resume detail styles */
    .resume-detail-header {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .resume-detail-header h3 {
      margin: 0 0 8px 0;
      color: #1e293b;
    }

    .resume-detail-header p {
      margin: 0;
      font-size: 0.9em;
      color: #64748b;
    }

    .resume-detail-section {
      margin-bottom: 15px;
    }

    .resume-detail-section h4 {
      margin: 0 0 8px 0;
      color: #374151;
    }

    .resume-detail-content {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
    }

    .resume-empty-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .resume-empty-message p {
      margin: 0;
      color: #dc2626;
    }

    .resume-detail-actions {
      margin-top: 10px;
    }

    .resume-detail-actions button {
      width: auto;
      margin-right: 5px;
    }

    /* Success message styles */
    .success-message {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .success-message p {
      margin: 0;
      color: #065f46;
    }

    .success-message p:last-child {
      margin: 5px 0 0 0;
      font-size: 0.9em;
      color: #047857;
    }

    /* Load actions styles */
    .load-actions {
      margin-top: 10px;
    }

    .load-actions button {
      width: auto;
      margin-right: 5px;
    }

    /* PDF success styles */
    .pdf-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .pdf-success h3 {
      margin: 0 0 10px 0;
      color: #065f46;
    }

    .pdf-success p {
      margin: 0 0 15px 0;
      color: #047857;
    }

    .pdf-downloads {
      margin-bottom: 15px;
    }

    .pdf-downloads button {
      width: 100%;
      margin-bottom: 8px;
    }

    .pdf-preview h4 {
      margin: 15px 0 8px 0;
      color: #374151;
      font-size: 0.9rem;
    }

    .pdf-preview .preview-content {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 8px;
      font-size: 0.8rem;
      color: #6b7280;
      max-height: 80px;
      overflow-y: auto;
    }

    /* Authentication styles */
    .auth-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .auth-status {
      font-size: 0.9rem;
      margin-bottom: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .auth-status.logged-in {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .auth-status.logged-out {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .auth-button {
      background: #3b82f6;
      border-color: #3b82f6;
      margin-bottom: 8px;
    }

    .auth-button:hover {
      background: #2563eb;
      border-color: #2563eb;
    }

    .rate-limit-info {
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }

    /* Auth modal styles */
    .auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 280px;
      position: relative;
    }

    .auth-modal-content h3 {
      margin: 0 0 10px 0;
      color: #1e293b;
    }

    .auth-modal-content p {
      margin: 0 0 15px 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    .auth-modal-content input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .auth-modal-content button {
      width: 100%;
      margin-bottom: 8px;
    }

    .auth-modal-content button[type="button"] {
      background: #6b7280 !important;
    }

    .auth-modal-content button[type="button"]:hover {
      background: #4b5563 !important;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none !important;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6b7280;
      width: auto;
      margin: 0;
      padding: 0;
    }

    .close-modal:hover {
      color: #374151;
    }

    /* Button Group Layout */
    .button-group {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 0;
      margin-top: 10px;
    }

    .button-group .btn {
      margin-top: 0;
      flex-shrink: 0;
    }

    .button-group .btn-load {
      width: 33.33%;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: none;
      font-size: 1.2rem;
      min-width: 50px;
    }

    .button-group .btn-manage {
      width: 66.67%;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
  </style>
</head>
<body>
      <div class="header">
      <div class="logo">
        <img src="icon48.png" alt="Rezlie Logo" />
        <h2>Rezlie</h2>
      </div>
      <button id="userInfoBtn" class="user-info-btn" style="display: none;">
        <span class="user-credits">Credits: --</span>
        <span class="user-email">Loading...</span>
        <span class="user-subscription">Free</span>
      </button>
    </div>

  <!-- Authentication Section -->
  <div class="auth-section">
    <div id="authStatus" class="auth-status logged-out">Not logged in</div>
    <button id="authButton" class="btn auth-button">Sign In</button>
    <div id="rateLimitInfo" class="rate-limit-info">Sign in to start generating resumes</div>
  </div>

  <label for="resumeSelect">📂 Select Resume:</label>
  <select id="resumeSelect" name="resumeSelect" aria-label="Select resume template">
    <option value="resume-1">Professional Resume</option>
    <option value="resume-2">Technical Resume</option>
    <option value="resume-3">Creative Resume</option>
    <option value="resume-4">Custom Resume</option>
  </select>

  <label for="jobDesc">📄 Job Description:</label>
  <textarea id="jobDesc" name="jobDesc" placeholder="Paste the job description here..." aria-label="Job description input"></textarea>

  <div class="button-group">
    <button id="loadResumeBtn" class="btn btn-purple btn-load" title="Load a resume file from your computer" aria-label="Load resume file">📂</button>
    <button id="manageResumesBtn" class="btn btn-green btn-manage" title="Manage and edit your resume templates" aria-label="Manage resumes">📝 Manage Resumes</button>
  </div>
  <button id="extractJobBtn" class="btn" title="Extract job description from current page" aria-label="Extract job description">🔍 Extract Job Description</button>
  <button id="generateBtn" class="btn" title="Generate AI-tailored resume and cover letter" aria-label="Generate tailored content">🪄 Tailor with AI</button>


  <pre id="output" role="status" aria-live="polite"></pre>

  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
