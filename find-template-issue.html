        const PDF_SERVICE_URL = 'https://pdf-service2-hid27m3hm-avidshotzs-projects.vercel.app/api/success';

        function showStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testPDF(name, html) {
            showStatus(`🔄 Testing: ${name}...`, 'info');
            console.log(`Testing: ${name}`);
            console.log(`HTML length: ${html.length} characters`);
            
            try {
                const response = await fetch(PDF_SERVICE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: html })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const sizeKB = (blob.size / 1024).toFixed(1);
                    showStatus(`✅ ${name}: SUCCESS! PDF generated (${sizeKB} KB) - HTML: ${html.length} chars`, 'success');
                    return true;
                } else {
                    const errorText = await response.text();
                    showStatus(`❌ ${name}: FAILED! HTTP ${response.status} - HTML: ${html.length} chars - ${errorText.substring(0, 150)}`, 'error');
                    return false;
                }
            } catch (error) {
                showStatus(`❌ ${name}: ERROR! ${error.message}`, 'error');
                return false;
            }
        }
